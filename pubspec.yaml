name: card_organizer
description: "Local-first business card organizer. No account, no cloud."
publish_to: 'none'

# The only place the version lives. Bump the build number by 1 per release.
version: 0.7.5+19

environment:
  sdk: ^3.13.0

dependencies:
  axial_app_kit:
    path: packages/axial_app_kit
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  phone_numbers_parser: ^9.0.28
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  camera: ^0.12.1
  opencv_dart: ^2.2.2
  permission_handler: ^13.0.2
  image: ^4.12.0
  http: ^1.6.0
  device_info_plus: ^13.3.0
  open_filex: ^5.0.0
  google_mlkit_barcode_scanning: ^0.16.1
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  file_picker: ^13.1.0
  archive: ^4.5.2
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  ndef_record: ^1.4.2
  local_auth: ^3.0.2
  basic_utils: ^5.8.2
  wakelock_plus: ^1.8.2
  window_manager: ^0.5.2
  desktop_drop: ^0.8.0
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-HankenGrotesk.txt
    - assets/brand/
    - CHANGELOG.md
  # Variable fonts; weights are set with FontVariation('wght', …) in lib/app/theme.dart.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
