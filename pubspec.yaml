name: card_organizer
description: "Local-first business card organizer. No account, no cloud."
publish_to: 'none'

# The only place the version lives. Bump the build number by 1 per release.
version: 0.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  phone_numbers_parser: ^9.0.28
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-HankenGrotesk.txt
    - assets/brand/
  # Variable fonts; weights are set with FontVariation('wght', …) in lib/app/theme.dart.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
