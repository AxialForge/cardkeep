<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #262624; color: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #2E2E2B 0%, #1F1F1D 100%)"></div>

<div aria-hidden="true" style="position: absolute; left: 35px; top: 300px; width: 320px; height: 183px; transform: rotate(-2deg); box-sizing: border-box; border-radius: 4px; background: #F2F2EF; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
<div style="width: 120px; height: 12px; background: #3A3A38; border-radius: 2px"></div>
<div>
<div style="width: 140px; height: 12px; background: #5A5A57; border-radius: 2px; margin-bottom: 8px"></div>
<div style="width: 90px; height: 8px; background: #9A9A96; border-radius: 2px; margin-bottom: 14px"></div>
<div style="width: 190px; height: 7px; background: #B5B5B1; border-radius: 2px; margin-bottom: 6px"></div>
<div style="width: 220px; height: 7px; background: #B5B5B1; border-radius: 2px"></div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 27px; top: 292px; width: 336px; height: 199px">
<div style="position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-left: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF; border-top-left-radius: 8px"></div>
<div style="position: absolute; right: 0; top: 0; width: 28px; height: 28px; border-right: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF; border-top-right-radius: 8px"></div>
<div style="position: absolute; left: 0; bottom: 0; width: 28px; height: 28px; border-left: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF; border-bottom-left-radius: 8px"></div>
<div style="position: absolute; right: 0; bottom: 0; width: 28px; height: 28px; border-right: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF; border-bottom-right-radius: 8px"></div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 12px 0 12px; display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<div style="flex: 1; display: flex; justify-content: center">
<div style="display: flex; padding: 3px; border-radius: 22px; background: rgba(0,0,0,0.55)">
<button onClick="{{ pickSingle }}" aria-pressed="{{ singleOn }}" style="height: 38px; padding: 0 18px; border: 0; border-radius: 19px; font-size: 14px; font-weight: 500; cursor: pointer; background: {{ singleBg }}; color: {{ singleFg }}">Single</button>
<button onClick="{{ pickBatch }}" aria-pressed="{{ batchOn }}" style="height: 38px; padding: 0 18px; border: 0; border-radius: 19px; font-size: 14px; font-weight: 500; cursor: pointer; background: {{ batchBg }}; color: {{ batchFg }}">Batch</button>
</div>
</div>
<button onClick="{{ toggleTorch }}" aria-pressed="{{ torchOn }}" aria-label="Torch" style="width: 44px; height: 44px; border-radius: 22px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: {{ torchBg }}; color: {{ torchFg }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
</button>
</div>

<div style="position: absolute; left: 0; right: 0; top: 76px; display: flex; justify-content: center">
<button style="height: 36px; max-width: 340px; padding: 0 14px; border: 0; border-radius: 18px; background: rgba(0,0,0,0.55); color: #FFFFFF; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #D4D4D0">EVENT</span>
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Fabricators Expo 2026</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
</button>
</div>

<div style="position: absolute; left: 0; right: 0; top: 516px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(0,0,0,0.6); font-size: 14px; display: flex; align-items: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
Card detected. Hold steady.
</div>
<div style="font-size: 13px; color: #D4D4D0">Front side</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 28px 20px">
<sc-if value="{{ batchOn }}" hint-placeholder-val="{{ false }}">
<a href="Queue.dc.html" style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,0.55); text-decoration: none; color: #FFFFFF">
<div style="display: flex; gap: 6px">
<div style="width: 44px; height: 28px; border-radius: 3px; background: #F2F2EF"></div>
<div style="width: 44px; height: 28px; border-radius: 3px; background: #D9D9D5"></div>
<div style="width: 44px; height: 28px; border-radius: 3px; background: #BEBEBA"></div>
</div>
<div style="flex: 1; font-size: 14px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">{{ countText }}</span> in queue, reading in the background</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</sc-if>

<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Import from gallery" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: rgba(0,0,0,0.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-2 6 4"/></svg>
</button>

<sc-if value="{{ singleOn }}" hint-placeholder-val="{{ true }}">
<a href="Review.dc.html" aria-label="Capture card" style="width: 80px; height: 80px; border-radius: 40px; border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<span style="width: 62px; height: 62px; border-radius: 31px; background: #FFFFFF"></span>
</a>
</sc-if>
<sc-if value="{{ batchOn }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ addOne }}" aria-label="Capture card, batch mode" style="width: 80px; height: 80px; border-radius: 40px; border: 4px solid #FFFFFF; background: transparent; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 62px; height: 62px; border-radius: 31px; background: #FFFFFF"></span>
</button>
</sc-if>

<button aria-label="Add back side" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: rgba(0,0,0,0.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0113.500-5.800L20 8.500M20 4v5h-5M20 12a8 8 0 01-13.500 5.800L4 15.500M4 20v-5h5"/></svg>
</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["single","batch"],"default":"single"}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state && this.state.mode) || this.props.mode || 'single';
    const torch = !!(this.state && this.state.torch);
    const count = (this.state && this.state.count) || 12;
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#111111' : '#FFFFFF' });
    const s = seg(mode === 'single'), b = seg(mode === 'batch');
    return {
      singleOn: mode === 'single', singleBg: s.bg, singleFg: s.fg,
      batchOn: mode === 'batch', batchBg: b.bg, batchFg: b.fg,
      torchOn: torch,
      torchBg: torch ? '#FFFFFF' : 'rgba(0,0,0,0.55)',
      torchFg: torch ? '#111111' : '#FFFFFF',
      countText: String(count),
      pickSingle: () => this.setState({ mode: 'single' }),
      pickBatch: () => this.setState({ mode: 'batch' }),
      toggleTorch: () => this.setState({ torch: !torch }),
      addOne: () => this.setState({ count: count + 1 })
    };
  }
}
</script>
</body>
</html>
