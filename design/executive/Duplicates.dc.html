<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duplicates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F6; color: #0E1A2B; font-family: 'Hanken Grotesk', system-ui, sans-serif">
<div style="flex:none;padding:14px 16px 6px 16px"><div style="display:flex;align-items:center;gap:10px"><a href="Menu.dc.html" aria-label="Open menu" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E2E5EA;display:flex;align-items:center;justify-content:center;color:#0E1A2B;text-decoration:none;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a><div style="flex:1"></div></div><h1 style="margin:10px 4px 0 4px;font-family:'Newsreader',Georgia,serif;font-size:32px;font-weight:600;line-height:1.1;letter-spacing:-0.01em">Duplicates</h1><div style="margin:4px 4px 0 4px;font-size:14px;color:#4A5568">7 possible matches</div></div><div style="flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px 16px"><div style="margin-top:6px"><div style="display:flex;padding:3px;border-radius:12px;background:#E6E9EE"><button onClick="{{ pickAll }}" aria-pressed="{{ onAll }}" style="flex:1;height:40px;border:0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bgAll }};color:{{ fgAll }};box-shadow:{{ shAll }}">All 7</button><button onClick="{{ pickExact }}" aria-pressed="{{ onExact }}" style="flex:1;height:40px;border:0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bgExact }};color:{{ fgExact }};box-shadow:{{ shExact }}">Exact 3</button><button onClick="{{ pickSimilar }}" aria-pressed="{{ onSimilar }}" style="flex:1;height:40px;border:0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:{{ bgSimilar }};color:{{ fgSimilar }};box-shadow:{{ shSimilar }}">Similar 4</button></div></div><div style="margin-top:12px;border-radius:18px;background:#FFFFFF;border:1px solid #E2E5EA;overflow:hidden"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="5"><a href="Merge.dc.html" style="display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 14px;box-sizing:border-box;text-decoration:none;color:#0E1A2B;border-bottom:1px solid #EDEFF3"><div style="display:flex;flex:none"><div style="width:38px;height:38px;border-radius:19px;background:#E8ECF3;border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',Georgia,serif;font-size:15px;font-weight:600">{{ r.iniA }}</div><div style="width:38px;height:38px;border-radius:19px;background:#F3E9D4;border:2px solid #FFFFFF;margin-left:-12px;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',Georgia,serif;font-size:15px;font-weight:600">{{ r.iniB }}</div></div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">{{ r.nameA }}</div><div style="font-size:12px;color:#4A5568;margin-top:2px">{{ r.nameB }} · {{ r.why }}</div></div><span style="flex:none;font-size:11px;font-weight:700;border-radius:10px;padding:3px 9px;background:{{ r.bg }};color:{{ r.fg }}">{{ r.conf }}</span></a></sc-for></div></div><div style="flex:none;display:flex;gap:10px;padding:12px 16px 22px 16px;background:#FFFFFF;border-top:1px solid #E2E5EA"><a href="Merge.dc.html" style="flex:1;height:52px;border-radius:14px;background:#0E1A2B;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center">Merge all 3 exact matches</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  gs(k, d) { const v = this.state && this.state[k]; return v === undefined ? d : v; }
  sv(keys, cur, sk) {
    const o = {};
    keys.forEach((k) => {
      const on = cur === k;
      const K = k[0].toUpperCase() + k.slice(1);
      o['on' + K] = on;
      o['bg' + K] = on ? '#FFFFFF' : 'transparent';
      o['fg' + K] = on ? '#0E1A2B' : '#4A5568';
      o['sh' + K] = on ? '0 1px 3px rgba(14,26,43,0.16)' : 'none';
      o['pick' + K] = () => this.setState({ [sk]: k });
    });
    return o;
  }
  tg(o, id, on) {
    const I = id[0].toUpperCase() + id.slice(1);
    o[id + 'On'] = on;
    o[id + 'Bg'] = on ? '#0E1A2B' : '#8793A5';
    o[id + 'Left'] = on ? '23px' : '3px';
    o['toggle' + I] = () => this.setState({ [id]: !on });
  }
  qr(seed) {
    const n = 25; let s = seed; let d = '';
    const rnd = () => { s = (s * 48271) % 2147483647; return s / 2147483647; };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const tl = x < 7 && y < 7, tr = x >= n - 7 && y < 7, bl = x < 7 && y >= n - 7;
      let on;
      if (tl || tr || bl) {
        const fx = x < 7 ? x : x - (n - 7), fy = y < 7 ? y : y - (n - 7);
        on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
      } else on = rnd() > 0.52;
      if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    return d;
  }
  renderVals() {
    const f = this.gs('filter', 'all');
    const all = [
      { a: 'Priya Nambiar', b: 'Priya Nambiar', why: 'same mobile', exact: true, conf: '100%' },
      { a: 'Marcus Oyelaran', b: 'M. Oyelaran', why: 'same email', exact: true, conf: '100%' },
      { a: 'Elena Voss', b: 'Elena Voss', why: 'same mobile', exact: true, conf: '100%' },
      { a: 'Tomás Aguirre', b: 'Tomas Aguirre', why: 'same company', exact: false, conf: '93%' },
      { a: 'Dmitri Kowalczyk', b: 'Dimitri Kowalczyk', why: 'similar name', exact: false, conf: '88%' },
      { a: 'Wen Zhao', b: 'Wen Zhao-Li', why: 'similar name', exact: false, conf: '84%' },
      { a: 'Hannah Whitcomb', b: 'Hannah Whitcombe', why: 'similar name', exact: false, conf: '81%' }
    ];
    const ini = (n) => n.split(' ').map((p) => p[0]).slice(0, 2).join('');
    const rows = all.filter((d) => f === 'all' || (f === 'exact' && d.exact) || (f === 'similar' && !d.exact)).map((d) => ({
      iniA: ini(d.a), iniB: ini(d.b), nameA: d.a, nameB: d.b, why: d.why, conf: d.conf,
      bg: d.exact ? '#0E1A2B' : '#FBF1DC', fg: d.exact ? '#FFFFFF' : '#7A4E0B'
    }));
    return Object.assign({ rows }, this.sv(['all', 'exact', 'similar'], f, 'filter'));
  }
}
</script>
</body>
</html>
