<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Follow-ups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F6; color: #0E1A2B; font-family: 'Hanken Grotesk', system-ui, sans-serif">
<div style="flex:none;padding:14px 16px 6px 16px"><div style="display:flex;align-items:center;gap:10px"><a href="Menu.dc.html" aria-label="Open menu" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E2E5EA;display:flex;align-items:center;justify-content:center;color:#0E1A2B;text-decoration:none;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a><div style="flex:1"></div></div><h1 style="margin:10px 4px 0 4px;font-family:'Newsreader',Georgia,serif;font-size:32px;font-weight:600;line-height:1.1;letter-spacing:-0.01em">Follow-ups</h1><div style="margin:4px 4px 0 4px;font-size:14px;color:#4A5568">6 open · today is Mon, Oct 19</div></div><div style="flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px 16px"><div style="display:flex;gap:10px;margin-top:6px"><div style="flex:1;padding:12px;border-radius:16px;background:#FBF1DC"><div style="font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600;color:#7A4E0B;line-height:1">1</div><div style="font-size:12px;color:#7A4E0B;margin-top:4px">Overdue</div></div><div style="flex:1;padding:12px;border-radius:16px;background:#E8ECF3"><div style="font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600;line-height:1">3</div><div style="font-size:12px;color:#4A5568;margin-top:4px">This week</div></div><div style="flex:1;padding:12px;border-radius:16px;background:#FFFFFF;border:1px solid #E2E5EA"><div style="font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600;line-height:1">2</div><div style="font-size:12px;color:#4A5568;margin-top:4px">Later</div></div></div><sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><div style="margin:18px 4px 8px 4px;font-size:12px;font-weight:700;letter-spacing:0.08em;color:#7A5B22">{{ g.title }}</div><div style="border-radius:18px;background:#FFFFFF;border:1px solid #E2E5EA;overflow:hidden"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:6px;min-height:72px;padding:6px 6px 6px 4px;border-bottom:1px solid #EDEFF3"><button onClick="{{ it.toggle }}" aria-pressed="{{ it.done }}" aria-label="Mark done" style="width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:12px;box-sizing:border-box;border:2px solid #0E1A2B;background:{{ it.dotBg }};display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></button><div style="flex:1;min-width:0;opacity:{{ it.opacity }}"><div style="font-size:15px;font-weight:600">{{ it.name }}</div><div style="font-size:13px;color:#4A5568;margin-top:2px">{{ it.task }}</div><span style="display:inline-block;margin-top:5px;font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;background:{{ it.bg }};color:{{ it.fg }}">{{ it.due }}</span></div><a href="{{ it.mail }}" aria-label="Email" style="width:44px;height:44px;border-radius:22px;background:#E8ECF3;color:#0E1A2B;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l9 6 9-6"/></svg></a></div></sc-for></div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  gs(k, d) { const v = this.state && this.state[k]; return v === undefined ? d : v; }
  sv(keys, cur, sk) {
    const o = {};
    keys.forEach((k) => {
      const on = cur === k;
      const K = k[0].toUpperCase() + k.slice(1);
      o['on' + K] = on;
      o['bg' + K] = on ? '#FFFFFF' : 'transparent';
      o['fg' + K] = on ? '#0E1A2B' : '#4A5568';
      o['sh' + K] = on ? '0 1px 3px rgba(14,26,43,0.16)' : 'none';
      o['pick' + K] = () => this.setState({ [sk]: k });
    });
    return o;
  }
  tg(o, id, on) {
    const I = id[0].toUpperCase() + id.slice(1);
    o[id + 'On'] = on;
    o[id + 'Bg'] = on ? '#0E1A2B' : '#8793A5';
    o[id + 'Left'] = on ? '23px' : '3px';
    o['toggle' + I] = () => this.setState({ [id]: !on });
  }
  qr(seed) {
    const n = 25; let s = seed; let d = '';
    const rnd = () => { s = (s * 48271) % 2147483647; return s / 2147483647; };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const tl = x < 7 && y < 7, tr = x >= n - 7 && y < 7, bl = x < 7 && y >= n - 7;
      let on;
      if (tl || tr || bl) {
        const fx = x < 7 ? x : x - (n - 7), fy = y < 7 ? y : y - (n - 7);
        on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
      } else on = rnd() > 0.52;
      if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    return d;
  }
  renderVals() {
    const done = this.gs('done', {});
    const mk = (id, name, task, due, kind, mail) => ({
      name, task, due, mail,
      done: !!done[id], dotBg: done[id] ? '#0E1A2B' : '#FFFFFF', opacity: done[id] ? '0.45' : '1',
      bg: kind === 'over' ? '#FBF1DC' : '#E8ECF3', fg: kind === 'over' ? '#7A4E0B' : '#0E1A2B',
      toggle: () => this.setState({ done: Object.assign({}, done, { [id]: !done[id] }) })
    });
    const groups = [
      { title: 'OVERDUE', items: [mk('dw', 'Dana Whitfield', 'Send revised quote', 'Oct 16 · 3 days overdue', 'over', 'mailto:d.whitfield@example.com')] },
      { title: 'THIS WEEK', items: [
        mk('mo', 'Marcus Oyelaran', 'Congratulate on new role at Corvane', 'Oct 22', 'wk', 'mailto:m.oyelaran@corvane.example'),
        mk('ro', 'Renata Okafor', 'Introduce yourself, confirm contact info', 'Oct 23', 'wk', 'mailto:r.okafor@northgatefasteners.example'),
        mk('ta', 'Tomás Aguirre', 'Confirm hydraulic fittings spec', 'Oct 24', 'wk', 'mailto:t.aguirre@calderhydraulics.example')] },
      { title: 'LATER', items: [
        mk('pn', 'Priya Nambiar', 'Send die insert pricing', 'Oct 27', 'later', 'mailto:p.nambiar@haldentooling.example'),
        mk('dk', 'Dmitri Kowalczyk', 'Schedule plant visit', 'Oct 27', 'later', 'mailto:d.kowalczyk@haldentooling.example')] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
