<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
input{font-family:inherit}
input::placeholder{color:#5B6676}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F6; color: #0E1A2B; font-family: 'Hanken Grotesk', system-ui, sans-serif">

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px 16px">
<a href="Scan.dc.html" aria-label="Back to scanner" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E5EA; display: flex; align-items: center; justify-content: center; color: #0E1A2B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<div style="flex: 1">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.1">Review scan</h1>
<div style="font-size: 12px; color: #4A5568; margin-top: 2px">Card 1 of 6 in this batch</div>
</div>
<span style="font-size: 12px; font-weight: 700; color: #7A4E0B; background: #FBF1DC; border-radius: 12px; padding: 5px 10px">2 to check</span>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto">

<div style="padding: 14px 16px 12px 16px; background: #E8ECF3">
<div style="position: relative; width: 358px; height: 205px; box-sizing: border-box; border-radius: 8px; background: #FAFAF8; box-shadow: 0 8px 20px rgba(14,26,43,0.14); overflow: hidden">
<sc-for list="{{ blocks }}" as="b" hint-placeholder-count="6">
<button onClick="{{ b.pick }}" aria-pressed="{{ b.selected }}" aria-label="{{ b.label }}" style="position: absolute; left: {{ b.x }}px; top: {{ b.y }}px; width: {{ b.w }}px; height: {{ b.h }}px; box-sizing: border-box; padding: 0 3px; text-align: left; color: #0E1A2B; cursor: pointer; white-space: nowrap; overflow: hidden; font-size: {{ b.fs }}px; font-weight: {{ b.fw }}; border-radius: 4px; background: {{ b.bg }}; border: {{ b.border }}">{{ b.text }}</button>
</sc-for>
</div>
<div style="margin-top: 10px; font-size: 13px; color: #4A5568">Tap a text block on the card, then choose its field.</div>
</div>

<div style="padding: 12px 16px 14px 16px; background: #FFFFFF; border-bottom: 1px solid #E2E5EA">
<div style="font-size: 14px; margin-bottom: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #7A5B22">SELECTED</span> &nbsp;{{ selText }}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="8">
<button onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="height: 34px; padding: 0 13px; border-radius: 17px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}">{{ c.name }}</button>
</sc-for>
</div>
</div>

<div style="margin: 14px 16px 0 16px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E5EA; display: flex; align-items: center; gap: 10px; font-size: 14px">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #E8ECF3; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E1A2B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="11" height="11" rx="2"/><rect x="10" y="9" width="11" height="11" rx="2"/></svg>
</span>
<span style="flex: 1; line-height: 1.3">Possible duplicate of <strong style="font-weight: 600">Priya Nambiar</strong></span>
<a href="Queue.dc.html" style="font-weight: 700; text-decoration: underline">Compare</a>
</div>

<div style="margin: 12px 16px 0 16px; padding: 4px 16px 16px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E5EA">

<div style="display: flex; gap: 10px; margin-top: 14px">
<div style="flex: 1; min-width: 0">
<label for="f-first" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">First name</label>
<input id="f-first" type="text" value="Priya" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>
<div style="flex: 1; min-width: 0">
<label for="f-last" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">Last name</label>
<input id="f-last" type="text" value="Nambiar" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>
</div>

<div style="margin-top: 14px">
<div style="display: flex; align-items: center; margin-bottom: 5px">
<label for="f-title" style="flex: 1; font-size: 12px; font-weight: 600; color: #4A5568">Title</label>
<span style="font-size: 11px; font-weight: 700; color: #7A4E0B; background: #FBF1DC; border-radius: 8px; padding: 2px 8px">Check</span>
</div>
<input id="f-title" type="text" value="Director of Procurement" style="width: 100%; height: 48px; box-sizing: border-box; border: 2px solid #B26A00; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFF9EC; color: #0E1A2B">
</div>

<div style="margin-top: 14px">
<label for="f-company" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">Company</label>
<input id="f-company" type="text" value="Halden Tooling Group" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>

<div style="margin-top: 14px">
<div style="display: flex; align-items: center; margin-bottom: 5px">
<label for="f-mobile" style="flex: 1; font-size: 12px; font-weight: 600; color: #4A5568">Mobile</label>
<span style="font-size: 11px; font-weight: 700; color: #7A4E0B; background: #FBF1DC; border-radius: 8px; padding: 2px 8px">Check</span>
</div>
<input id="f-mobile" type="tel" value="+1 (330) 555-0142" style="width: 100%; height: 48px; box-sizing: border-box; border: 2px solid #B26A00; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFF9EC; color: #0E1A2B">
</div>

<div style="margin-top: 14px">
<label for="f-office" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">Office</label>
<input id="f-office" type="tel" value="+1 (330) 555-0188" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>

<div style="margin-top: 14px">
<label for="f-email" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">Email</label>
<input id="f-email" type="email" value="p.nambiar@haldentooling.example" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>

<div style="margin-top: 14px">
<label for="f-addr" style="display: block; font-size: 12px; font-weight: 600; color: #4A5568; margin-bottom: 5px">Address</label>
<input id="f-addr" type="text" value="4200 Industrial Pkwy, Akron, OH 44311" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #0E1A2B">
</div>
</div>

<div style="margin: 12px 16px 0 16px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E5EA">
<div style="display: flex; align-items: center; min-height: 32px"><span style="width: 76px; flex: none; font-size: 13px; color: #4A5568">Event</span><span style="font-size: 15px; font-weight: 600">Fabricators Expo 2026</span></div>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px">
<span style="width: 68px; flex: none; font-size: 13px; color: #4A5568">Tags</span>
<span style="height: 30px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 15px; background: #E8ECF3; font-size: 13px; font-weight: 600">Procurement</span>
<button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 1px dashed #8793A5; background: transparent; font-size: 13px; font-weight: 600; color: #4A5568; cursor: pointer">+ Tag</button>
</div>
</div>

<div style="height: 16px"></div>
</div>

<div style="flex: none; display: flex; gap: 10px; padding: 12px 16px 22px 16px; background: #FFFFFF; border-top: 1px solid #E2E5EA">
<a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid #0E1A2B; background: #FFFFFF; color: #0E1A2B; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save</a>
<a href="Scan.dc.html" style="flex: 1.5; height: 52px; border-radius: 14px; background: #0E1A2B; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save and scan next</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'title';
    const assign = Object.assign(
      { logo: 'Company', name: 'Name', title: 'Title', phone: 'Mobile', email: 'Email', addr: 'Address' },
      (this.state && this.state.assign) || {}
    );
    const defs = [
      { id: 'logo', text: 'HALDEN TOOLING GROUP', x: 14, y: 14, w: 196, h: 22, fs: 12, fw: 700 },
      { id: 'name', text: 'Priya Nambiar', x: 14, y: 100, w: 140, h: 26, fs: 18, fw: 600 },
      { id: 'title', text: 'Director of Procurement', x: 14, y: 128, w: 150, h: 18, fs: 12, fw: 400 },
      { id: 'phone', text: 'M +1 330 555 0142', x: 14, y: 150, w: 126, h: 16, fs: 11, fw: 400 },
      { id: 'email', text: 'p.nambiar@haldentooling.example', x: 14, y: 168, w: 206, h: 16, fs: 11, fw: 400 },
      { id: 'addr', text: '4200 Industrial Pkwy, Akron, OH', x: 14, y: 186, w: 190, h: 16, fs: 11, fw: 400 }
    ];
    const blocks = defs.map((d) => ({
      x: d.x, y: d.y, w: d.w, h: d.h, fs: d.fs, fw: d.fw, text: d.text,
      selected: sel === d.id,
      label: d.text + ', assigned to ' + assign[d.id],
      bg: sel === d.id ? 'rgba(176,138,74,0.14)' : 'transparent',
      border: sel === d.id ? '2px solid #B08A4A' : '1px dashed #8793A5',
      pick: () => this.setState({ sel: d.id })
    }));
    const names = ['Name', 'Title', 'Company', 'Mobile', 'Office', 'Email', 'Address', 'Ignore'];
    const chips = names.map((n) => {
      const on = assign[sel] === n;
      return {
        name: n, on,
        bg: on ? '#0E1A2B' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#0E1A2B',
        border: on ? '#0E1A2B' : '#D5DAE1',
        pick: () => this.setState({ assign: Object.assign({}, assign, { [sel]: n }) })
      };
    });
    const cur = defs.find((d) => d.id === sel);
    return { blocks, chips, selText: '"' + cur.text + '" is ' + assign[sel] };
  }
}
</script>
</body>
</html>
