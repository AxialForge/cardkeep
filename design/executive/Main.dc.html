<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
input::placeholder{color:#5B6676}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F6; color: #0E1A2B; font-family: 'Hanken Grotesk', system-ui, sans-serif">

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0 16px">
<a href="Menu.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E5EA; display: flex; align-items: center; justify-content: center; color: #0E1A2B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>
</a>
<button aria-label="Add contact manually" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E5EA; display: flex; align-items: center; justify-content: center; color: #0E1A2B; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>

<div style="flex: none; padding: 8px 20px 0 20px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1">Contacts</h1>
<div style="margin-top: 4px; font-size: 14px; color: #4A5568">1,284 people across 312 companies</div>
</div>

<div style="flex: none; padding: 14px 16px 0 16px">
<a href="Queue.dc.html" style="height: 56px; border-radius: 16px; background: #0E1A2B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 0 16px">
<span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(176,138,74,0.22); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3C48A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 600">3 follow-ups due this week</span>
<span style="font-size: 13px; color: #E3C48A; font-weight: 600">12 to review</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</div>

<div style="flex: none; padding: 12px 16px 0 16px; position: relative">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 32px; top: 26px" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="search" aria-label="Search contacts" placeholder="Search names, companies, notes, card text" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #E2E5EA; border-radius: 14px; background: #FFFFFF; padding: 0 14px 0 44px; font-size: 15px; font-family: inherit; color: #0E1A2B; box-shadow: 0 1px 2px rgba(14,26,43,0.05)">
</div>

<div style="flex: none; padding: 12px 16px 12px 16px">
<div style="display: flex; padding: 3px; border-radius: 12px; background: #E6E9EE">
<button onClick="{{ pickName }}" aria-pressed="{{ nameOn }}" style="flex: 1; height: 38px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ nameBg }}; color: {{ nameFg }}; box-shadow: {{ nameShadow }}">Name</button>
<button onClick="{{ pickCompany }}" aria-pressed="{{ companyOn }}" style="flex: 1; height: 38px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ companyBg }}; color: {{ companyFg }}; box-shadow: {{ companyShadow }}">Company</button>
<button onClick="{{ pickRecent }}" aria-pressed="{{ recentOn }}" style="flex: 1; height: 38px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ recentBg }}; color: {{ recentFg }}; box-shadow: {{ recentShadow }}">Recent</button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; margin: 0 16px; border-radius: 16px 16px 0 0; background: #FFFFFF; border: 1px solid #E2E5EA; border-bottom: 0; padding-right: 22px; padding-bottom: 96px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<div>
<sc-if value="{{ r.header }}" hint-placeholder-val="{{ true }}">
<div style="padding: 12px 16px 4px 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #7A5B22; text-transform: uppercase">{{ r.headerText }}</div>
</sc-if>
<a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 12px 8px 16px; box-sizing: border-box; text-decoration: none; color: #0E1A2B">
<div style="width: 44px; height: 44px; border-radius: 22px; background: #E8ECF3; color: #0E1A2B; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 600; flex: none">{{ r.initials }}</div>
<div style="flex: 1; min-width: 0; border-bottom: 1px solid #EDEFF3; padding: 10px 0">
<div style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</div>
<div style="font-size: 13px; color: #4A5568; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.sub }}</div>
</div>
<sc-if value="{{ r.flag }}" hint-placeholder-val="{{ false }}">
<span style="flex: none; font-size: 11px; font-weight: 700; color: #7A4E0B; background: #FBF1DC; border-radius: 10px; padding: 3px 8px">Review</span>
</sc-if>
<span style="flex: none; font-size: 12px; color: #4A5568">{{ r.meta }}</span>
</a>
</div>
</sc-for>
</div>

<sc-if value="{{ showJump }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; right: 20px; top: 352px; width: 20px; display: flex; flex-direction: column; align-items: center">
<sc-for list="{{ letters }}" as="l" hint-placeholder-count="26">
<button aria-label="Jump to {{ l }}" style="width: 20px; height: 18px; padding: 0; border: 0; background: transparent; font-size: 10px; font-weight: 700; color: #4A5568; cursor: pointer">{{ l }}</button>
</sc-for>
</div>
</sc-if>

<a href="Scan.dc.html" aria-label="Scan a card" style="position: absolute; right: 20px; bottom: 28px; height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: #0E1A2B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(14,26,43,0.32)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3C48A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.500-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>
Scan card
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sort":{"editor":"enum","options":["name","company","recent"],"default":"name"}}'>
class Component extends DCLogic {
  renderVals() {
    const sort = (this.state && this.state.sort) || this.props.sort || 'name';
    const data = [
      { first: 'Priya', last: 'Nambiar', company: 'Halden Tooling Group', title: 'Director of Procurement', added: 1 },
      { first: 'Marcus', last: 'Oyelaran', company: 'Brightline Logistics', title: 'VP, Regional Operations', added: 3, flag: true },
      { first: 'Elena', last: 'Voss', company: 'Northgate Fasteners', title: 'Chief Commercial Officer', added: 2 },
      { first: 'Tomás', last: 'Aguirre', company: 'Calder Hydraulics', title: 'Senior Director, Engineering', added: 7 },
      { first: 'Hannah', last: 'Whitcomb', company: 'Ironbridge Steel', title: 'Head of Purchasing', added: 5 },
      { first: 'Dmitri', last: 'Kowalczyk', company: 'Halden Tooling Group', title: 'General Manager', added: 4, flag: true },
      { first: 'Grace', last: 'Lindqvist', company: 'Pinecrest Coatings', title: 'Managing Director', added: 9 },
      { first: 'Samuel', last: 'Okafor', company: 'Brightline Logistics', title: 'Operations Manager', added: 6 },
      { first: 'Wen', last: 'Zhao', company: 'Calder Hydraulics', title: 'Regional Sales Director', added: 8 },
      { first: 'Isabel', last: 'Marchetti', company: 'Ironbridge Steel', title: 'Director, Quality', added: 10 }
    ];
    const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
    if (sort === 'name') data.sort((a, b) => cmp(a.last, b.last) || cmp(a.first, b.first));
    else if (sort === 'company') data.sort((a, b) => cmp(a.company, b.company) || cmp(a.last, b.last));
    else data.sort((a, b) => a.added - b.added);
    let prev = null;
    const rows = data.map((d) => {
      let key = null;
      if (sort === 'name') key = d.last[0];
      else if (sort === 'company') key = d.company;
      const header = key !== null && key !== prev;
      if (key !== null) prev = key;
      return {
        initials: d.first[0] + d.last[0],
        name: d.first + ' ' + d.last,
        sub: sort === 'company' ? d.title : d.title + ', ' + d.company,
        flag: !!d.flag,
        header,
        headerText: key,
        meta: sort === 'recent' ? d.added + 'd ago' : ''
      };
    });
    const seg = (on) => ({
      bg: on ? '#FFFFFF' : 'transparent',
      fg: on ? '#0E1A2B' : '#4A5568',
      shadow: on ? '0 1px 3px rgba(14,26,43,0.16)' : 'none'
    });
    const n = seg(sort === 'name'), c = seg(sort === 'company'), r = seg(sort === 'recent');
    return {
      rows,
      letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
      showJump: sort === 'name',
      nameOn: sort === 'name', nameBg: n.bg, nameFg: n.fg, nameShadow: n.shadow,
      companyOn: sort === 'company', companyBg: c.bg, companyFg: c.fg, companyShadow: c.shadow,
      recentOn: sort === 'recent', recentBg: r.bg, recentFg: r.fg, recentShadow: r.shadow,
      pickName: () => this.setState({ sort: 'name' }),
      pickCompany: () => this.setState({ sort: 'company' }),
      pickRecent: () => this.setState({ sort: 'recent' })
    };
  }
}
</script>
</body>
</html>
