name: CI
on:
  push:
    branches: [main]
  pull_request:

# opencv_dart compiles OpenCV with CMake during the build: it needs the NDK
# path for Android and CMake/Ninja for the host build that `flutter test` uses.
env:
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Build tools for OpenCV
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
