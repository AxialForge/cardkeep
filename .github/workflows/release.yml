name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# opencv_dart compiles OpenCV with CMake during the build: it needs the NDK
# path for Android and CMake/Ninja for the host build that `flutter test` uses.
env:
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check tag matches pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != pubspec $v"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build tools for OpenCV
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      # Symbols and the R8 mapping are kept so release crashes can be decoded (MOB-BLD-0004).
      - run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols
      - name: Rename APKs
        run: |
          v=${GITHUB_REF_NAME#v}
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv app-$abi-release.apk CardKeep-$v-$abi.apk
          done
      - name: Debug symbols, mapping and checksums
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir -p dist
          (cd build/symbols && zip -qr "$GITHUB_WORKSPACE/dist/CardKeep-$v-symbols.zip" .)
          cp build/app/outputs/mapping/release/mapping.txt dist/CardKeep-$v-mapping.txt
          cp build/app/outputs/flutter-apk/CardKeep-*.apk dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: Release notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          files: |
            dist/CardKeep-*.apk
            dist/CardKeep-*-symbols.zip
            dist/CardKeep-*-mapping.txt
            dist/SHA256SUMS.txt
